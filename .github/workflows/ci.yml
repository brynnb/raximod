name: Build and test

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Raximod.slnx
      - run: dotnet build Raximod.slnx -c Release --no-restore
      - run: dotnet test tests/Raximod.Generation.Tests -c Release --no-build
